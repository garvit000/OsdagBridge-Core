name: osdagbridge-core
channels:
  - osdag
  - conda-forge
  - defaults
dependencies:
  - python>=3.11,<3.13
  - pip
  - osdag
  - pythonocc-core
  - numpy>=1.21.0
  - scipy>=1.10.1
  - pandas>=1.5.0
  - matplotlib>=3.5
  - mplcursors
  - pillow
  - fiona
  - shapely
  - xarray
  - ifcopenshell
  - plotly
  - pytest>=6.2.2
  - pip:
      - openseespy>=3.2.2.6
      - opsvis>=1.0
      - -e .

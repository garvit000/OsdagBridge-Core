{% set name = "osdagbridge-core" %}
{% set version = "1.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ..

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv
  entry_points:
    - osdagbridge-cli=osdagbridge.cli.__main__:main

requirements:
  host:
    - python >=3.11,<3.13
    - pip
    - setuptools >=61
    - wheel

  run:
    - python >=3.11,<3.13
    - numpy >=1.21.0
    - scipy >=1.10.1
    - pandas >=1.5.0
    - matplotlib-base >=3.5
    - mplcursors
    - pillow
    - fiona
    - shapely
    - xarray
    - openseespy >=3.2.2.6
    - opsvis >=1.0
    - ifcopenshell
    - plotly

test:
  imports:
    - osdagbridge.core
    - osdagbridge.cli
    - ospgrillage
  commands:
    - osdagbridge-cli --help

about:
  home: https://github.com/osdagbridge/OsdagBridge-Core
  license: MIT
  license_file: LICENSE
  summary: "Computational, analysis, and design engine for OsdagBridge steel bridges"

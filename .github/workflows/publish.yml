name: Build and Publish Conda Package

on:
  push:
    tags:
      - 'v*'

jobs:
  build-upload:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      # Miniforge ships a recent conda with the libmamba solver and conda-forge
      # preconfigured, so there is no slow "update conda" step and dependency
      # solves take seconds instead of minutes.
      - name: Setup Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          conda-remove-defaults: "true"

      - name: Install build tools
        shell: bash -l {0}
        run: |
          conda install -y conda-build anaconda-client
          conda config --set solver libmamba

      - name: Build package
        shell: bash -l {0}
        run: |
          conda-build conda-recipe -c osdag -c conda-forge --output-folder conda-out

      - name: Upload package
        shell: bash -l {0}
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          PACKAGE=$(find conda-out -name "osdagbridge-core-*.conda" -o -name "osdagbridge-core-*.tar.bz2" | head -n 1)
          if [ -z "$PACKAGE" ]; then
            echo "No package found in conda-out" >&2
            exit 1
          fi
          echo "Uploading $PACKAGE"
          anaconda upload "$PACKAGE" --force

name: Build and Publish to Anaconda

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.11"
          activate-environment: build-env

      - name: Install build tools
        shell: bash -l {0}
        run: |
          conda install -y -c conda-forge conda-build anaconda-client

      - name: Extract Tag Version
        id: get_version
        shell: bash
        run: |
          # Strip leading 'v' if triggered by a tag (e.g. v1.0.1 -> 1.0.1)
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9] ]]; then
            VERSION=${GITHUB_REF_NAME#v}
            echo "PKG_VERSION=$VERSION" >> $GITHUB_ENV
            echo "Building version from tag: $VERSION"
          else
            echo "Not a version tag ($GITHUB_REF_NAME), falling back to recipe default."
          fi

      - name: Build Conda Package
        shell: bash -l {0}
        run: |
          conda build conda-recipe -c osdag -c conda-forge --output-folder ./conda-dist

      - name: Upload to Anaconda
        shell: bash -l {0}
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          # Upload any built .conda or .tar.bz2 packages
          PACKAGES=$(find ./conda-dist -type f \( -name "*.conda" -o -name "*.tar.bz2" \))
          echo "Found packages to upload: $PACKAGES"
          anaconda --token "$ANACONDA_API_TOKEN" upload --label main --skip-existing $PACKAGES
